name: Snyk Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # Habilita el caché oficial de Node para npm

      - name: Limpiar caché de npm (Solución para EINTEGRITY)
        run: npm cache clean --force

      - name: Instalar dependencias limpias
        run: npm install

      - name: Ejecutar escaneo de vulnerabilidades con Snyk (Rompe el build si falla)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Subir el reporte al Dashboard web de Snyk
        uses: snyk/actions/node@master
        if: always() # Obliga a que este paso se ejecute aunque el escaneo anterior haya fallado
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
